<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced To-Do List App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-section input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .input-section button {
      padding: 12px 18px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-section button:hover {
      background: #5a67d8;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #e2e8f0;
      cursor: pointer;
      transition: 0.3s;
    }

    .filters button.active {
      background: #667eea;
      color: white;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      transition: 0.3s;
    }

    li.completed span {
      text-decoration: line-through;
      color: gray;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .task-left span {
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }

    .edit-btn {
      background: #f59e0b;
    }

    .delete-btn {
      background: #ef4444;
    }

    .empty-message {
      text-align: center;
      color: #555;
      margin-top: 20px;
    }

    @media (max-width: 500px) {
      .input-section {
        flex-direction: column;
      }

      .input-section button {
        width: 100%;
      }

      li {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>To-Do List App</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Enter a task..." />
      <button id="addTaskBtn">Add Task</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <p class="empty-message" id="emptyMessage">
      No tasks available.
    </p>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const emptyMessage = document.getElementById('emptyMessage');

    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';

    // SAVE TASKS TO LOCAL STORAGE
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // RENDER TASKS
    function renderTasks() {
      taskList.innerHTML = '';

      let filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') {
          return !task.completed;
        }

        if (currentFilter === 'completed') {
          return task.completed;
        }

        return true;
      });

      if (filteredTasks.length === 0) {
        emptyMessage.style.display = 'block';
      } else {
        emptyMessage.style.display = 'none';
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');

        if (task.completed) {
          li.classList.add('completed');
        }

        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" class="toggle-task" data-id="${task.id}" ${task.completed ? 'checked' : ''}>
            <span>${task.text}</span>
          </div>

          <div class="actions">
            <button class="edit-btn" data-id="${task.id}">Edit</button>
            <button class="delete-btn" data-id="${task.id}">Delete</button>
          </div>
        `;

        taskList.appendChild(li);
      });
    }

    // ADD TASK
    function addTask() {
      const text = taskInput.value.trim();

      if (text === '') {
        alert('Please enter a task');
        return;
      }

      const newTask = {
        id: Date.now(),
        text,
        completed: false
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();

      taskInput.value = '';
    }

    // EVENT: ADD TASK BUTTON
    addTaskBtn.addEventListener('click', addTask);

    // EVENT: ENTER KEY
    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // EVENT DELEGATION FOR TASK ACTIONS
    taskList.addEventListener('click', function(e) {

      // DELETE TASK
      if (e.target.classList.contains('delete-btn')) {
        const id = Number(e.target.dataset.id);

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();
        renderTasks();
      }

      // EDIT TASK
      if (e.target.classList.contains('edit-btn')) {
        const id = Number(e.target.dataset.id);

        const task = tasks.find(task => task.id === id);

        const updatedText = prompt('Edit task:', task.text);

        if (updatedText !== null && updatedText.trim() !== '') {
          task.text = updatedText.trim();

          saveTasks();
          renderTasks();
        }
      }
    });

    // TOGGLE COMPLETE
    taskList.addEventListener('change', function(e) {
      if (e.target.classList.contains('toggle-task')) {
        const id = Number(e.target.dataset.id);

        const task = tasks.find(task => task.id === id);

        task.completed = e.target.checked;

        saveTasks();
        renderTasks();
      }
    });

    // FILTER TASKS
    filterButtons.forEach(button => {
      button.addEventListener('click', function() {

        filterButtons.forEach(btn => btn.classList.remove('active'));

        this.classList.add('active');

        currentFilter = this.dataset.filter;

        renderTasks();
      });
    });

    // INITIAL RENDER
    renderTasks();
  </script>

</body>
</html>
